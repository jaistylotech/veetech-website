server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 301 SEO Legacy Redirects
    location = /pressure-testing { return 301 /superior-value-creation/pressure-testing; }
    location = /flushing { return 301 /superior-value-creation/flushing; }
    location = /equipment-rental { return 301 /superior-value-creation/equipment-rental; }
    location = /long-term-service-agreement { return 301 /superior-value-creation/long-term-service-agreement; }
    location = /maintenance-contracts { return 301 /superior-value-creation/maintenance-contracts; }
    location = /product-training { return 301 /superior-value-creation/product-training; }
    location = /refurbishments-recertification { return 301 /superior-value-creation/refurbishments-recertification; }
    location = /refurbishment-recertification { return 301 /superior-value-creation/refurbishments-recertification; }

    location ~* ^/(senior-projects-engineer.*|careers?/.*|jobs?/.*) { return 301 /careers; }

    location = /other-engineered-solutions { return 301 /solutions/engineered-solutions; }
    location = /other-engineered-solutions/lube-oil-systems { return 301 /solutions/engineered-solutions/lube-oil-systems; }
    location = /other-engineered-solutions/metering-skids { return 301 /solutions/engineered-solutions/metering-skids; }
    location = /other-engineered-solutions/dra-injection-systems { return 301 /solutions/engineered-solutions/dra-injection-systems; }
    location = /other-engineered-solutions/hipps-systems { return 301 /solutions/engineered-solutions/hipps-systems; }
    location = /other-engineered-solutions/nitrogen-generator-packages { return 301 /solutions/engineered-solutions/nitrogen-generator-packages; }
    location = /other-engineered-solutions/surge-relief-skids { return 301 /solutions/engineered-solutions/surge-relief-skids; }
    location = /lube-oil-systems { return 301 /solutions/engineered-solutions/lube-oil-systems; }
    location = /metering-skids { return 301 /solutions/engineered-solutions/metering-skids; }
    location = /dra-injection-systems { return 301 /solutions/engineered-solutions/dra-injection-systems; }
    location = /hipps-systems { return 301 /solutions/engineered-solutions/hipps-systems; }
    location = /nitrogen-generator-packages { return 301 /solutions/engineered-solutions/nitrogen-generator-packages; }
    location = /surge-relief-skids { return 301 /solutions/engineered-solutions/surge-relief-skids; }
    location = /chemical-injection-packages { return 301 /solutions/chemical-injection-packages; }
    location = /wellhead-control-systems { return 301 /solutions/wellhead-control-systems; }
    location = /modular-packages { return 301 /solutions/modular-packages; }

    location = /about-us { return 301 /about; }
    location = /contact-us { return 301 /contact; }
    location = /services { return 301 /after-market-services; }
    location = /terms-and-conditions { return 301 /terms; }
    location = /privacy { return 301 /privacy-policy; }

    location / {
        proxy_pass http://veetech-app:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
