services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: veetech-app-dev
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=5173
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - veetech-net

networks:
  veetech-net:
    driver: bridge
